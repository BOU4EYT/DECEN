# fly.toml app configuration file generated for decen on 2026-05-06T08:15:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decen'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DECEN_HOST = '0.0.0.0'
  PORT = '8080'

[[mounts]]
  source = 'decen_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
