app = "decen-main"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DECEN_HOST = "0.0.0.0"
  PORT = "8080"

[[mounts]]
  source = "decen_data"
  destination = "/data"

# Use Fly.io's simplified HTTP service instead of the verbose [[services]]
# + [[services.ports]] shape. This avoids Fly Launch/finalize manifests that
# expect service ports as integers while still supporting websocket upgrades.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
